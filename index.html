function shrink(f){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.78))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
var RM={g:[],u:[]};
var TK=["title","desc","chips","benefits","p1","p2","p3","old","ship","shipo","top","wa"];
function snap(x){var s={};TK.forEach(function(k){s[k]=x[k]});s.ut=(x.uses||[]).map(function(u){return u.text});return s}
function thumbs(list,k){return'<div style="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0">'+list.map(function(u,i){return'<div style="position:relative;width:64px;height:64px"><img src="'+u+'" id="th'+k+i+'" style="width:64px;height:64px;object-fit:cover;border-radius:10px" alt=""><button type="button" data-k="'+k+'" data-i="'+i+'" aria-label="حذف الصورة" style="position:absolute;top:-8px;inset-inline-start:-8px;width:26px;height:26px;border-radius:50%;border:0;background:#D93025;color:#fff;cursor:pointer">✕</button></div>'}).join("")+'</div>'}
